<body>
    <p-card header="Pontuação da galera" subheader="Aqui você pode verificar o progresso da comunidade">
        <span>
            <h3>Selecione uma data para listar a pontuação</h3>
        </span>

        <p-floatLabel>
            <p-calendar [disabled]="isloading" inputId="GuysScoresDateSelect" [iconDisplay]="'input'" [showIcon]="true"
                dateFormat="dd/mm/yy" [(ngModel)]="GuysScoresDateSelect" />
            <label for="GuysScheduleDateSelect">Selecione a data para consultar a pontuação</label>
        </p-floatLabel>

        <p-button class="btnSelectDate" label="Selecionar data" [loading]="isloading" (click)="selectDateGuysScore()" />

        <p-table #dtScoresGuys [columns]="cols" [value]="scoresGuysToList" [tableStyle]="{ 'min-width': '50%' }"
            styleClass="p-datatable-striped" responsiveLayout="stack" [paginator]="true" [rows]="5"
            [rowsPerPageOptions]="[5, 10,15, 20]" [globalFilterFields]="['name','stream','score']">

            <ng-template pTemplate="caption">
                <div class="flex align-items-center justify-content-between">
                    <p-iconField iconPosition="left" class="ml-auto">
                        <p-inputIcon>
                            <i class="pi pi-search"></i>
                        </p-inputIcon>
                        <input pInputText type="text"
                            (input)="dtScoresGuys.filterGlobal(filterDtGuysScore($event),'contains')"
                            placeholder="Buscar..." />
                    </p-iconField>
                    <p-button icon="pi pi-refresh" label="Atualizar" (click)="refreshDtGuysScore()" />
                    <p-button icon="pi pi-external-link" label="Exportar" pTooltip="PDF" (onClick)="exportPDF()" />
                </div>
            </ng-template>

            <ng-template pTemplate="header" let-columns>
                <tr>
                    <th *ngFor="let col of columns">
                        {{ col.header }}
                    </th>
                </tr>
            </ng-template>
        
            <ng-template pTemplate="body" let-score>
                <tr>
                    <td>{{score.name}}</td>
                    <td>{{score.stream}}</td>
                    <td>{{score.score}}</td>
                    
                </tr>
            </ng-template>
        </p-table>

    </p-card>
</body>
